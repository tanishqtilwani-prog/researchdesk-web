<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchDesk — Indian equity research</title>
<link rel="canonical" id="canon" href="https://researchdesk.co.in/">
<meta property="og:site_name" content="ResearchDesk">
<meta property="og:type" content="website">
<meta name="description" content="Company research for 2,300 Indian listed companies. Ratios benchmarked against peers, ownership history, pledge tracking and earnings call transcripts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2316233a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia' fill='%23b0801f' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"]{
  --bg:#ffffff; --panel:#ffffff; --ink:#16233a; --ink2:#3c4859; --mut:#6f7789;
  --mut2:#9aa1af; --line:#e6e8ec; --line2:#f2f3f6;
  --gold:#b0801f; --gold-soft:#fbf6ea;
  --red:#a8352f; --grn:#1f6b4a; --amb:#8a6a1a; --accent:#16233a;
  --serif:'Newsreader',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:5px;
  --h-blue-bg:#E6F1FB; --h-blue-fg:#0C447C; --h-blue-sub:#185FA5;
  --h-teal-bg:#E1F5EE; --h-teal-fg:#085041; --h-teal-sub:#0F6E56;
  --h-amber-bg:#FAEEDA; --h-amber-fg:#633806; --h-amber-sub:#854F0B;
  --h-purple-bg:#EEEDFE; --h-purple-fg:#3C3489; --h-purple-sub:#534AB7;
  --h-coral-bg:#FAECE7; --h-coral-fg:#712B13; --h-coral-sub:#993C1D;
  --h-gray-bg:#F2F3F5; --h-gray-fg:#2C2C2A; --h-gray-sub:#5F5E5A;
}
[data-theme="dark"]{
  --h-blue-bg:#0C447C; --h-blue-fg:#B5D4F4; --h-blue-sub:#85B7EB;
  --h-teal-bg:#085041; --h-teal-fg:#9FE1CB; --h-teal-sub:#5DCAA5;
  --h-amber-bg:#633806; --h-amber-fg:#FAC775; --h-amber-sub:#EF9F27;
  --h-purple-bg:#3C3489; --h-purple-fg:#CECBF6; --h-purple-sub:#AFA9EC;
  --h-coral-bg:#712B13; --h-coral-fg:#F5C4B3; --h-coral-sub:#F0997B;
  --h-gray-bg:#232120; --h-gray-fg:#D3D1C7; --h-gray-sub:#B4B2A9;
  --bg:#050a16; --panel:#0a1122; --ink:#e8ecf4; --ink2:#c2cadb; --mut:#8892a8;
  --mut2:#5f6b82; --line:#182238; --line2:#111a2c;
  --gold:#d4a84a; --gold-soft:#141c30;
  --red:#e0776f; --grn:#4fc08d; --amb:#d4a84a; --accent:#e8ecf4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --h-blue-bg:#0C447C; --h-blue-fg:#B5D4F4; --h-blue-sub:#85B7EB;
    --h-teal-bg:#085041; --h-teal-fg:#9FE1CB; --h-teal-sub:#5DCAA5;
    --h-amber-bg:#633806; --h-amber-fg:#FAC775; --h-amber-sub:#EF9F27;
    --h-purple-bg:#3C3489; --h-purple-fg:#CECBF6; --h-purple-sub:#AFA9EC;
    --h-coral-bg:#712B13; --h-coral-fg:#F5C4B3; --h-coral-sub:#F0997B;
    --h-gray-bg:#232120; --h-gray-fg:#D3D1C7; --h-gray-sub:#B4B2A9;
    --bg:#050a16; --panel:#0a1122; --ink:#e8ecf4; --ink2:#c2cadb; --mut:#8892a8;
    --mut2:#5f6b82; --line:#182238; --line2:#111a2c;
    --gold:#d4a84a; --gold-soft:#141c30;
    --red:#e0776f; --grn:#4fc08d; --amb:#d4a84a; --accent:#e8ecf4;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);
     font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 26px 70px}

/* nav */
nav{border-bottom:1px solid var(--line);margin-bottom:24px;padding:15px 0;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    position:sticky;top:0;background:var(--bg);z-index:60}
.brand{font-size:29px;font-weight:500;letter-spacing:-.9px;text-decoration:none;
        white-space:nowrap;line-height:1;display:flex;align-items:center;gap:9px}
.brand b{font-weight:600;color:var(--gold);margin-left:-.13em}
.blogo{width:30px;height:30px;flex:none}
.navlinks{display:flex;gap:18px;margin-left:auto}
.navlinks a{font-family:var(--sans);font-size:12.5px;color:var(--mut);text-decoration:none;
            white-space:nowrap;padding-bottom:2px;border-bottom:1px solid transparent}
.navlinks a:hover,.navlinks a.on{color:var(--ink);border-bottom-color:var(--gold)}
@media(max-width:820px){.navlinks{order:3;margin-left:0;width:100%;gap:16px}}
.stub{padding:80px 0;max-width:56ch}
.stub h2{font-size:30px;font-weight:500;letter-spacing:-.9px;margin-bottom:14px}
.stub p{color:var(--ink2);font-size:15.5px;line-height:1.72;margin-bottom:12px}
.mbtn{display:none;border:1px solid var(--line);background:var(--panel);color:var(--mut);
      width:32px;height:32px;border-radius:var(--r);cursor:pointer;align-items:center;
      justify-content:center;flex:none;padding:0}
.mbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.drawer{position:fixed;inset:0;background:rgba(10,17,34,.42);z-index:90;display:none}
.drawer.open{display:block}
.drawer nav{position:absolute;top:0;right:0;bottom:0;width:min(74vw,268px);background:var(--panel);
      border-left:1px solid var(--line);flex-direction:column;align-items:stretch;
      gap:0;padding:18px 0;position:fixed}
.drawer a{display:block;padding:13px 22px;font-family:var(--sans);font-size:15px;
      color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line2)}
.drawer a:hover{background:var(--gold-soft);color:var(--gold)}
.drawer .dhead{font-family:var(--sans);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;
      color:var(--mut2);padding:0 22px 12px}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--mut);
      width:32px;height:32px;border-radius:var(--r);cursor:pointer;display:flex;
      align-items:center;justify-content:center;flex:none}
.tbtn:hover{border-color:var(--gold);color:var(--gold)}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.searchwrap{flex:1;max-width:440px;position:relative}
#q{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);
   padding:8px 12px 8px 32px;font-family:var(--sans);font-size:13px;border-radius:var(--r)}
#q:focus{outline:none;border-color:var(--gold)}
.sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
       width:13px;height:13px;stroke:var(--mut2);fill:none;stroke-width:2.4}
#sug{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--panel);
     border:1px solid var(--line);border-radius:var(--r);z-index:70;max-height:360px;
     overflow-y:auto;display:none;box-shadow:0 10px 30px rgba(22,35,58,.10)}
#sug div{padding:9px 13px;cursor:pointer;font-family:var(--sans);font-size:13px;
         border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px}
#sug div:last-child{border-bottom:none}
#sug div:hover,#sug div.on{background:var(--gold-soft)}
#sug small{color:var(--mut2);font-family:var(--mono);font-size:11px;white-space:nowrap}

/* company header */
.chead{display:grid;grid-template-columns:1fr 296px;gap:34px;align-items:start;
       padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:24px}
@media(max-width:1000px){.chead{grid-template-columns:1fr;gap:18px}}
.ptag{font-family:var(--sans);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
      color:var(--gold);font-weight:600;margin-bottom:7px}
h1{font-size:clamp(25px,3.2vw,33px);font-weight:500;letter-spacing:-.8px;line-height:1.12}
.ids{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:8px;letter-spacing:.2px}
.ltpline{font-family:var(--serif);font-size:27px;margin-top:11px;color:var(--ink);
  font-weight:500;letter-spacing:-.6px;line-height:1.1;display:flex;align-items:baseline;gap:8px}
.ltpline small{font-family:var(--sans);font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--mut2);font-weight:600;letter-spacing:.9px}
@media(max-width:760px){.ltpline{font-size:24px}}
.tags{margin-top:11px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--sans);font-size:10px;letter-spacing:.5px;text-transform:uppercase;
     font-weight:500;border:1px solid var(--line);padding:3px 8px;color:var(--mut);
     border-radius:3px;background:var(--panel)}
.tag.g{border-color:var(--grn);color:var(--grn)} .tag.r{border-color:var(--red);color:var(--red)}
.desc{font-size:15px;line-height:1.7;margin-top:15px;color:var(--ink2);max-width:76ch}
.sub{font-family:var(--sans);font-size:11px;color:var(--mut2);margin-top:10px}
.snap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:13px 16px;border-top:2px solid var(--ink)}
.snaprow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
         border-bottom:1px solid var(--line2);font-size:13px}
.snaprow:last-child{border-bottom:none}
.snaprow span:first-child{color:var(--mut);font-family:var(--sans);font-size:11.5px}
.snaprow span:last-child{font-family:var(--mono);font-size:12px;font-weight:500}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,30,50,.04);border-radius:var(--r);
      padding:0 0 17px;overflow:hidden}
.card > section > *:not(.sech){margin-left:18px;margin-right:18px}
.card > section > .scroll{margin-left:18px;margin-right:18px}
.card.full{grid-column:1 / -1}
section{margin:0}
.sech{font-family:var(--sans);font-size:12.5px;letter-spacing:.2px;font-weight:600;
      padding:10px 18px;margin:0 0 15px;background:var(--h-gray-bg);color:var(--h-gray-fg);
      display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sech i{font-style:normal;letter-spacing:.1px;text-transform:none;font-size:11px;
        font-weight:400;opacity:.85}
.h-blue .sech{background:var(--h-blue-bg);color:var(--h-blue-fg)}
.h-blue .sech i{color:var(--h-blue-sub)}
.h-teal .sech{background:var(--h-teal-bg);color:var(--h-teal-fg)}
.h-teal .sech i{color:var(--h-teal-sub)}
.h-amber .sech{background:var(--h-amber-bg);color:var(--h-amber-fg)}
.h-amber .sech i{color:var(--h-amber-sub)}
.h-purple .sech{background:var(--h-purple-bg);color:var(--h-purple-fg)}
.h-purple .sech i{color:var(--h-purple-sub)}
.h-coral .sech{background:var(--h-coral-bg);color:var(--h-coral-fg)}
.h-coral .sech i{color:var(--h-coral-sub)}
.h-gray .sech i{color:var(--h-gray-sub)}
.spark{vertical-align:-3px}

/* metrics */
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:14px}
.mlab{font-family:var(--sans);font-size:10px;letter-spacing:.4px;text-transform:uppercase;
      color:var(--mut2);font-weight:500}
.mval{font-size:22px;font-weight:500;letter-spacing:-.5px;margin-top:4px;line-height:1.15}
.mdel{font-family:var(--mono);font-size:11px;margin-top:2px}
.up{color:var(--grn)} .dn{color:var(--red)} .fl{color:var(--mut2)}

/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--sans);font-size:10px;letter-spacing:.4px;text-transform:uppercase;
   color:var(--mut2);text-align:right;padding:0 0 8px 16px;font-weight:500;white-space:nowrap}
th:first-child{text-align:left;padding-left:0}
td{padding:7px 0 7px 16px;border-top:1px solid var(--line2);text-align:right;
   font-family:var(--mono);font-size:12px;white-space:nowrap}
td:first-child{text-align:left;font-family:var(--serif);font-size:13.5px;padding-left:0;color:var(--ink2)}
td.dim{color:var(--mut2)} td.v{font-family:var(--sans);font-size:10.5px;font-weight:500}
th.sep,td.sep{border-left:1px solid var(--line);padding-left:16px}
tbody tr:hover td{background:var(--gold-soft)}
tr.gaprow td{padding:0;height:9px;border-top:1px solid var(--line);background:none !important}

.cols{display:grid;grid-template-columns:1fr;gap:0}

/* flags */
.flag{padding:9px 0 9px 12px;border-left:2px solid var(--line);margin-bottom:10px}
.flag:last-child{margin-bottom:0}
.flag.r{border-left-color:var(--red)} .flag.g{border-left-color:var(--grn)}
.flagt{font-family:var(--sans);font-size:10px;letter-spacing:.5px;text-transform:uppercase;
       font-weight:600;margin-bottom:3px;color:var(--mut)}
.flag.r .flagt{color:var(--red)} .flag.g .flagt{color:var(--grn)}
.flagb{font-size:13.5px;line-height:1.6;color:var(--ink2)}

/* rank bars */
.rk{display:grid;grid-template-columns:96px 1fr 66px;gap:10px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line2)}
.rk:last-child{border-bottom:none}
.rkn{font-family:var(--sans);font-size:11.5px;color:var(--ink2)}
.rkbar{height:5px;background:var(--line2);position:relative;border-radius:3px}
.rkbar u{position:absolute;top:-3px;width:3px;height:11px;background:var(--gold);border-radius:2px}
.rkv{text-align:right;font-family:var(--mono);font-size:11px;color:var(--mut2)}
.rkv b{color:var(--ink);font-weight:500}

/* chart */
.chart{border-bottom:1px solid var(--line2);padding-bottom:3px}
.clab{display:flex;justify-content:space-between;font-family:var(--mono);
      font-size:10px;color:var(--mut2);margin-top:5px}
.ckey{font-family:var(--sans);font-size:11px;color:var(--mut);margin-bottom:9px;
      display:flex;gap:15px;flex-wrap:wrap}
.ckey span{display:flex;align-items:center;gap:5px}
.ckey i{width:13px;height:2px;display:inline-block;border-radius:2px}

/* news + docs */
.nw{padding:10px 0;border-top:1px solid var(--line2)}
.nw:first-child{border-top:none;padding-top:0}
.nwt{font-size:14.5px;line-height:1.5;text-decoration:none;display:block;color:var(--ink)}
.nwt:hover{color:var(--gold)}
.nwm{font-family:var(--sans);font-size:11px;color:var(--mut2);margin-top:4px}
.nwm b{color:var(--mut);font-weight:500}
.th{border-bottom:1px solid var(--line2);padding:9px 0}
.th:last-child{border-bottom:none}
.thn{font-family:var(--sans);font-size:12.5px}
.thn a{text-decoration:none}.thn a:hover{color:var(--gold)}
.thm{font-family:var(--mono);font-size:10.5px;color:var(--mut2);margin-top:2px}

/* home */
.bigsearch{max-width:640px;margin:0 auto}
.bigsearch #q{padding:15px 16px 15px 44px;font-size:17px;border-radius:8px}
.bigsearch .sicon{left:16px;width:17px;height:17px}
.bigsearch #sug div{padding:11px 15px;font-size:14px}
.hometop{padding:74px 0 0;text-align:center}
@media(max-width:700px){.hometop{padding:40px 0 0}}
.hometop h2{font-size:clamp(27px,3.6vw,38px);font-weight:500;letter-spacing:-1.2px;
            line-height:1.16;margin-bottom:12px}
.hometop .lede{color:var(--mut);font-size:15.5px;margin:0 auto 30px;max-width:52ch}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
         margin:26px auto 0;max-width:760px}
.chip{font-family:var(--sans);font-size:12.5px;text-decoration:none;color:var(--ink2);
      border:1px solid var(--line);border-radius:20px;padding:6px 14px;background:var(--panel)}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chiplab{font-family:var(--sans);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
         color:var(--mut2);margin-top:44px}
.indwrap{margin-top:56px;border-top:1px solid var(--line);padding-top:26px}
.indhead{font-family:var(--sans);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
         color:var(--mut2);margin-bottom:16px}
.indgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:1px;
         background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ind{background:var(--panel);padding:13px 15px;cursor:pointer;display:flex;
     justify-content:space-between;align-items:baseline;gap:10px}
.ind:hover{background:var(--gold-soft)}
.ind.on{background:var(--gold-soft)}
.indn{font-size:14px}
.indc{font-family:var(--mono);font-size:11px;color:var(--mut2)}
.indlist{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);
         background:var(--panel);padding:6px 16px 10px;display:none}
.indlist.open{display:block}
.indlist h4{font-family:var(--sans);font-size:11px;letter-spacing:1px;text-transform:uppercase;
            color:var(--mut2);font-weight:600;padding:10px 0 8px}
.cl2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 22px}
.co2{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
     border-bottom:1px solid var(--line2);text-decoration:none;font-size:13.5px}
.co2:hover{color:var(--gold)}
.co2 small{font-family:var(--mono);font-size:10.5px;color:var(--mut2);white-space:nowrap}

.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:56px;padding:58px 0 30px;align-items:start}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:34px;padding:36px 0 20px}}
.herotext h2{font-size:clamp(30px,4vw,42px);font-weight:500;letter-spacing:-1.3px;
             line-height:1.16;margin-bottom:18px}
.herotext p{color:var(--ink2);font-size:16.5px;line-height:1.72;margin-bottom:14px;max-width:56ch}
.heronote{color:var(--mut) !important;font-size:14px !important;margin-top:22px !important}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pick{font-family:var(--sans);font-size:12.5px;text-decoration:none;color:var(--ink2);
      border:1px solid var(--line);border-radius:20px;padding:6px 14px;background:var(--panel)}
.pick:hover{border-color:var(--gold);color:var(--gold)}
.herolist{border-top:2px solid var(--ink);padding-top:4px}
.hl{padding:15px 0;border-bottom:1px solid var(--line2)}
.hl:last-child{border-bottom:none}
.hlt{font-family:var(--sans);font-size:12.5px;font-weight:600;margin-bottom:4px}
.hlb{font-size:14px;line-height:1.6;color:var(--mut)}

/* sectors + screens */
.pagehead{padding:26px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.pagehead h2{font-size:clamp(24px,3vw,31px);font-weight:500;letter-spacing:-1px;margin-bottom:8px}
.pagehead p{color:var(--mut);font-size:14px;max-width:62ch}
.stab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.stab button{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink2);padding:6px 13px;border-radius:20px;cursor:pointer}
.stab button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stab button:hover{border-color:var(--gold)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:16px}
.f label{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.4px;
  text-transform:uppercase;color:var(--mut2);font-weight:500;margin-bottom:5px}
.f select,.f input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  padding:6px 9px;font-family:var(--sans);font-size:12.5px;border-radius:4px}
.f select:focus,.f input:focus{outline:none;border-color:var(--gold)}
.resbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--sans);font-size:12px;color:var(--mut);margin:0 0 12px;flex-wrap:wrap}
.resbar b{color:var(--ink);font-weight:600}
.saved{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.saved button{font-family:var(--sans);font-size:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--mut);padding:5px 12px;border-radius:20px;cursor:pointer}
.saved button:hover{border-color:var(--gold);color:var(--gold)}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:2px 17px 14px;overflow-x:auto}
.tbl a{text-decoration:none}
.tbl a:hover{color:var(--gold)}
.themerow{display:grid;grid-template-columns:1fr 84px 90px;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line2)}
.themerow:last-child{border-bottom:none}
.themen{font-family:var(--sans);font-size:12.5px}
.themeb{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.themeb span{display:block;height:100%;border-radius:3px}
.themev{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right;white-space:nowrap}
.themev em{font-style:normal;font-weight:500;color:var(--ink)}
.deltaup{color:var(--red)} .deltadn{color:var(--grn)}

/* states */
.msg{padding:70px 0;text-align:center;color:var(--mut);font-family:var(--sans);font-size:14px}
.home{padding:60px 0 34px;max-width:62ch}
.home h2{font-size:33px;font-weight:500;letter-spacing:-1px;line-height:1.22;margin-bottom:16px}
.home p{color:var(--ink2);font-size:16px;line-height:1.72;margin-bottom:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
       gap:14px;margin-top:32px;max-width:920px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:15px 17px;border-top:2px solid var(--gold)}
.statv{font-size:25px;font-weight:500;letter-spacing:-.6px}
.statl{font-family:var(--sans);font-size:11px;color:var(--mut2);margin-top:3px}
footer{margin-top:40px;border-top:1px solid var(--line);padding-top:13px;
       font-family:var(--sans);font-size:10.5px;color:var(--mut2);line-height:1.65}
@media(max-width:1000px){.ratiogrid{grid-template-columns:1fr !important;gap:18px !important}}
@media(max-width:760px){
  .wrap{padding:0 14px 56px}
  nav{gap:10px;padding:12px 0;flex-wrap:wrap;align-items:center}
  .brand{font-size:20px;order:1}
  .mbtn{display:flex;order:2;margin-left:auto}
  .searchwrap{max-width:none;order:3;width:100%;flex:1 1 100%;margin-top:2px}
  .searchwrap #q{padding:12px 12px 12px 38px;font-size:15px;border-radius:8px}
  .searchwrap .sicon{left:13px;width:15px;height:15px}
  .navlinks{display:none}
  .tbtn{display:none}
  .grid{gap:14px}
  .card{padding:14px 14px 16px;border-radius:0;margin:0 -14px;border-left:none;border-right:none}
  .chead{padding-bottom:18px;margin-bottom:18px}
  h1{font-size:24px;letter-spacing:-.6px}
  .desc{font-size:14px}
  .mrow{grid-template-columns:1fr 1fr;gap:12px}
  .mval{font-size:19px}
  .snap{padding:12px 14px}
  .rk{grid-template-columns:80px 1fr 56px;gap:8px}
  .rkn{font-size:11px}
  table{font-size:12px}
  td,th{padding-left:12px}
  td:first-child{font-size:12.5px}
  .hometop{padding:30px 0 0}
  .indgrid{grid-template-columns:1fr}
  .cl2{grid-template-columns:1fr}
  .sech{font-size:12.5px}
  .filters{grid-template-columns:1fr 1fr;gap:11px;padding:13px 14px}
  .stab{gap:5px}
  .stab button{font-size:12px;padding:5px 11px}
  .pagehead{padding:18px 0 16px}
}
</style>
</head>
<body>
<div class="wrap">

<nav>
  <a class="brand" href="/">Research<b>Desk</b></a>
  <div class="searchwrap">
    <svg class="sicon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="q" placeholder="Company name or symbol" autocomplete="off" spellcheck="false">
    <div id="sug"></div>
  </div>
  <div class="navlinks">
    <a href="/sectors">Sectors</a>
    <a href="/screens">Screens</a>
  </div>

  </button>
</nav>
<div class="drawer" id="drawer">
  <nav>
    <div class="dhead">ResearchDesk</div>
    <a href="/">Home</a>
    <a href="/sectors">Sectors</a>
    <a href="/screens">Screens</a>
    <a href="#" id="dtheme">Switch theme</a>
  </nav>
</div>

<main id="main"><div class="msg">Loading…</div></main>

<footer>
  Sources: BSE corporate filings, shareholding XBRL and results snapshots; Upstox fundamentals;
  exchange financial statements; Google News. Figures are as reported and may contain errors.
  Not investment advice.
</footer>
</div>

<script>
const SB  = 'https://fqnemnikxilhocurgehk.supabase.co/rest/v1/';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxbmVtbmlreGlsaG9jdXJnZWhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Njg3NzEsImV4cCI6MjEwMTM0NDc3MX0.I5_P9pRRgQmLEe0gPsx1TzMMqdGqIAi9Bzp0jBES_Fw';
const H = {apikey:KEY, Authorization:'Bearer '+KEY};

const $ = s => document.querySelector(s);
async function api(path){
  try{ const r = await fetch(SB+path,{headers:H}); return r.ok ? await r.json() : []; }
  catch(e){ return []; }
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function slug(name, code){
  const t = String(name||'').toLowerCase()
    .replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'').slice(0,52).replace(/-+$/,'');
  return `/company/${t?t+'-':''}${code}`;
}
const sectorHref = n => '/sector/' + encodeURIComponent(String(n).replace(/\s+/g,'-'));

/* ---------- formatting ---------- */
function cr(v){
  if(v==null||isNaN(v)) return '—';
  const n = Number(v), a = Math.abs(n), s = n<0?'−':'';
  if(a>=100000) return s+'₹'+(a/100000).toFixed(2)+'L Cr';
  if(a>=1)      return s+'₹'+Math.round(a).toLocaleString('en-IN')+' Cr';
  return s+'₹'+a.toFixed(2)+' Cr';
}
function raw(v,d){ return (v==null||isNaN(v)) ? '—' : Number(v).toFixed(d==null?2:d); }
function pct(v,d){ return (v==null||isNaN(v)) ? '—' : Number(v).toFixed(d==null?2:d)+'%'; }
function delta(cur,prev,suffix){
  if(cur==null||prev==null||!prev) return '';
  const p = (cur-prev)/Math.abs(prev)*100;
  const cls = p>0?'up':(p<0?'dn':'fl');
  return `<div class="mdel ${cls}">${p>0?'+':''}${p.toFixed(1)}% ${suffix||''}</div>`;
}
function dmy(s){
  if(!s) return '—';
  const d = new Date(s);
  if(isNaN(d)) return String(s).slice(0,10);
  return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear();
}
const MON = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
const qOrder = p => {
  const t = String(p).match(/([A-Za-z]{3})[a-z]*[\s-]*(\d{2,4})/);
  if(!t) return 0;
  let y = +t[2]; if(y < 100) y += 2000;
  return y*100 + (MON[t[1]] || 0);
};

function spark(vals, w, h){
  const v = vals.filter(x=>x!=null && !isNaN(x));
  if(v.length < 3) return '';
  w = w||62; h = h||18;
  const mx = Math.max(...v), mn = Math.min(...v), rg = (mx-mn) || Math.abs(mx) || 1;
  const x = i => 2 + i*((w-6)/(v.length-1));
  const y = k => (h-3) - ((k-mn)/rg)*(h-7);
  const pts = v.map((k,i)=>`${x(i).toFixed(1)},${y(k).toFixed(1)}`).join(' ');
  const up = v[v.length-1] >= v[0];
  const col = up ? 'var(--grn)' : 'var(--red)';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(v.length-1).toFixed(1)}" cy="${y(v[v.length-1]).toFixed(1)}" r="2.2" fill="${col}"/>
  </svg>`;
}

/* ---------- search ---------- */
let LIST = [], hi = -1, LISTREADY = false, LISTP = null;
function loadList(){
  if(LISTREADY) return Promise.resolve(LIST);
  if(LISTP) return LISTP;
  LISTP = _loadList();
  return LISTP;
}
async function _loadList(){
  LIST = [];
  const base='companies?select=scrip_code,company_name,nse_symbol,market_cap,group_code&or=(group_code.eq.A,group_code.eq.B,group_code.eq.T,group_code.eq.X,group_code.eq.XT,group_code.eq.M,group_code.eq.MT,group_code.eq.Z,group_code.eq.ZP)&order=market_cap.desc.nullslast';
  for(let off=0; off<4000; off+=1000){
    const part = await api(base+'&limit=1000&offset='+off);
    LIST = LIST.concat(part);
    if(part.length<1000) break;
  }
  return LIST;
}
function renderSug(items){
  const box = $('#sug');
  if(!items.length){ box.style.display='none'; return; }
  box.innerHTML = items.map((c,i)=>
    `<div data-code="${c.scrip_code}" data-i="${i}">
       <span>${esc(c.company_name)}</span>
       <small>${c.market_cap? '₹'+Math.round(c.market_cap).toLocaleString('en-IN')+' Cr':''}</small>
     </div>`).join('');
  box.style.display='block'; hi=-1;
  box.querySelectorAll('div').forEach(d=>d.onclick=()=>go(d.dataset.code));
}
function search(v){
  const s = v.trim().toLowerCase();
  if(s.length<2){ $('#sug').style.display='none'; return; }
  const starts=[], has=[];
  for(const c of LIST){
    const n=(c.company_name||'').toLowerCase(), y=(c.nse_symbol||'').toLowerCase();
    if(n.startsWith(s)||y===s) starts.push(c);
    else if(n.includes(s)||y.includes(s)) has.push(c);
    if(starts.length>=9) break;
  }
  renderSug(starts.concat(has).slice(0,9));
}
function go(code){ const c=LIST.find(x=>x.scrip_code===code); location.href = slug(c&&c.company_name, code); }
$('#q').addEventListener('input', e=>{ loadList().then(()=>search(e.target.value)); });
$('#q').addEventListener('keydown', e=>{
  const box=$('#sug'), items=[...box.querySelectorAll('div')];
  if(!items.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    hi += e.key==='ArrowDown'?1:-1;
    if(hi<0) hi=items.length-1; if(hi>=items.length) hi=0;
    items.forEach((d,i)=>d.classList.toggle('on', i===hi));
  } else if(e.key==='Enter'){
    go(items[hi<0?0:hi].dataset.code);
  } else if(e.key==='Escape'){ box.style.display='none'; }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.searchwrap')) $('#sug').style.display='none'; });

/* ---------- home ---------- */
let INDCACHE = null;

async function home(){
  document.title = 'ResearchDesk — Indian equity research';
  $('#main').innerHTML = `
    <div class="hometop">
      <h2>Search a company</h2>
      <div id="bigslot"></div>
      <div class="chiplab">Start anywhere</div>
      <div class="chiprow" id="chips"></div>
    </div>
    <div class="indwrap">
      <div class="indhead">Browse by industry</div>
      <div class="indgrid" id="indgrid"></div>
      <div class="indlist" id="indlist"></div>
    </div>`;

  // move the real search box into the hero so all its logic still works
  const sw = document.querySelector('.searchwrap');
  const slot = document.getElementById('bigslot');
  if(sw && slot){ slot.appendChild(sw); slot.parentElement.classList.add('bigsearch'); sw.style.maxWidth='none'; }

  loadList().then(list=>{
    const pool = list.filter(c=>c.market_cap>800);
    const pick = [];
    const seen = new Set();
    while(pick.length<10 && seen.size<pool.length){
      const i = Math.floor(Math.random()*pool.length);
      if(seen.has(i)) continue;
      seen.add(i); pick.push(pool[i]);
    }
    const el = document.getElementById('chips');
    if(el) el.innerHTML = pick.map(c=>
      `<a class="chip" href="${slug(c.company_name,c.scrip_code)}">${esc(c.company_name.replace(/ Ltd\.?$/,''))}</a>`).join('');
  });

  industries();
}

async function industries(){
  if(!INDCACHE){
    let rows=[], off=0;
    while(true){
      const part = await api(`company_meta?select=scrip_code,industry_new&industry_new=not.is.null&limit=1000&offset=${off}`);
      if(!part.length) break;
      rows = rows.concat(part);
      if(part.length<1000) break;
      off += 1000;
    }
    const m = {};
    rows.forEach(r=>{ (m[r.industry_new] = m[r.industry_new] || []).push(r.scrip_code); });
    INDCACHE = Object.entries(m).sort((a,b)=>b[1].length-a[1].length);
  }
  const g = document.getElementById('indgrid');
  if(!g) return;
  g.innerHTML = INDCACHE.map(([name,codes],i)=>
    `<div class="ind" data-i="${i}"><span class="indn">${esc(name)}</span><span class="indc">${codes.length}</span></div>`).join('');
  g.querySelectorAll('.ind').forEach(d=> d.onclick = ()=> showIndustry(+d.dataset.i, d));
}

async function showIndustry(i, el){
  const [name, codes] = INDCACHE[i];
  document.querySelectorAll('.ind').forEach(d=>d.classList.remove('on'));
  el.classList.add('on');
  const box = document.getElementById('indlist');
  box.className = 'indlist open';
  box.innerHTML = `<h4>${esc(name)} — ${codes.length} companies</h4><div class="cl2">Loading…</div>`;
  const list = await loadList();
  const set = new Set(codes);
  const cos = list.filter(c=>set.has(c.scrip_code))
                  .sort((a,b)=>(b.market_cap||0)-(a.market_cap||0)).slice(0,60);
  box.innerHTML = `<h4>${esc(name)} — ${codes.length} companies</h4>
    <div class="cl2">${cos.map(c=>
      `<a class="co2" href="${slug(c.company_name,c.scrip_code)}"><span>${esc(c.company_name.replace(/ Ltd\.?$/,''))}</span>
       <small>${c.market_cap?Math.round(c.market_cap).toLocaleString('en-IN'):''}</small></a>`).join('')}</div>
    ${cos.length<codes.length?`<div class="thm" style="padding-top:10px">Showing the largest ${cos.length} by market cap.</div>`:''}`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------- company ---------- */
async function company(code){
  const [co] = await api(`companies?scrip_code=eq.${code}&select=*`);
  if(!co){ $('#main').innerHTML='<div class="msg">Company not found.</div>'; return; }
  document.title = co.company_name + ' — financials, ratios and ownership | ResearchDesk';
  if(co.isin) fetch('/api/ltp?isin='+encodeURIComponent(co.isin))
    .then(r=>r.json()).then(d=>{
      if(d && d.ltp!=null){
        const el = document.getElementById('ltp');
        if(el) el.innerHTML = '₹'+
          Number(d.ltp).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+
          '<small>LTP</small>';
      }
    }).catch(()=>{});
  const cn = document.getElementById('canon');
  if(cn) cn.href = 'https://researchdesk.co.in' + slug(co.company_name, co.scrip_code);
  const md = document.querySelector('meta[name="description"]');
  if(md) md.content = `${co.company_name}: quarterly results, ratios against peers, promoter holding and pledge, and earnings call transcripts — built from exchange filings.`;

  const [[meta],[ups],[rat],res,shp,fin,news,docs,qfin] = await Promise.all([
    api(`company_meta?scrip_code=eq.${code}&select=*`),
    api(`company_upstox?scrip_code=eq.${code}&select=*`),
    api(`ratios?scrip_code=eq.${code}&select=*`),
    api(`results_snapshot?scrip_code=eq.${code}&select=*`),
    api(`shareholding?scrip_code=eq.${code}&filing_type=eq.quarterly&select=*&order=qtrid.desc&limit=20`),
    api(`financials?scrip_code=eq.${code}&freq=eq.annual&select=statement,period,field,value&order=period.desc&limit=400`),
    api(`news?scrip_code=eq.${code}&select=*&order=published.desc&limit=5`),
    api(`transcripts?scrip_code=eq.${code}&select=headline,filed_at,pages,pdf_url&order=filed_at.desc&limit=6`),
    api(`financials?scrip_code=eq.${code}&freq=eq.quarterly&statement=eq.income&select=period,field,value&order=period.desc&limit=200`)
  ]);

  let peers = [], stat = null;
  if(rat && rat.peer_group){
    [peers,[stat]] = await Promise.all([
      api(`ratios?peer_group=eq.${encodeURIComponent(rat.peer_group)}&select=scrip_code,roce,roe,debt_equity,cfo_pat,current_ratio`),
      api(`sector_stats?peer_group=eq.${encodeURIComponent(rat.peer_group)}&select=*`)
    ]);
  }

  const hasData = !!(rat || (shp&&shp.length) || (res&&res.length) || (qfin&&qfin.length) || (fin&&fin.length));
  if(!hasData){
    $('#main').innerHTML = head(co,meta,ups,rat,shp,res) +
      `<div class="grid"><div class="card full h-gray"><section>
        <div class="sech"><span>No data yet</span><i>${esc(co.group_code)} group</i></div>
        <p style="font-size:14px;line-height:1.7;color:var(--ink2);max-width:62ch">
        Financials, ownership and ratios have not been collected for this company yet.
        Coverage currently runs across the main board; companies in the ${esc(co.group_code)}
        segment are being added.</p></section></div></div>`;
    wireDesc();
    return;
  }
  $('#main').innerHTML =
      head(co,meta,ups,rat,shp,res)
    + '<div class="grid">'
    +   `<div class="card h-amber">${latest(res,rat)}</div>`
    +   `<div class="card h-blue">${own(shp)}</div>`
    +   `<div class="card full h-teal">${ratios(rat,stat,peers,code,meta,ups)}</div>`
    +   `<div class="card full h-amber">${quarterly(res,qfin)}</div>`
    +   `<div class="card full h-gray">${annual(fin)}</div>`
    +   `<div class="card h-coral">${newsOnly(news)}</div>`
    +   `<div class="card h-purple">${docsOnly(docs)}</div>`
    + '</div>';
  wireDesc();
}

function descBlock(t){
  const LIM=340;
  if(t.length<=LIM) return `<div class="desc">${esc(t)}</div>`;
  let cut=t.lastIndexOf(' ',LIM); if(cut<0) cut=LIM;
  return `<div class="desc"><span id="dshort">${esc(t.slice(0,cut))}… </span>
    <span id="dfull" style="display:none">${esc(t)} </span>
    <a href="#" id="dtog" style="font-family:var(--sans);font-size:12.5px;color:var(--mut);text-decoration:underline;white-space:nowrap">more</a></div>`;
}
function wireDesc(){
  const t=document.getElementById('dtog'); if(!t) return;
  t.onclick=e=>{ e.preventDefault();
    const sh=document.getElementById('dshort'), fu=document.getElementById('dfull');
    const open = fu.style.display==='none';
    sh.style.display = open?'none':'inline';
    fu.style.display = open?'inline':'none';
    t.textContent = open?'less':'more';
  };
}
function head(co,meta,ups,rat,shp,res){
  const tags = [`<span class="tag">Group ${esc(co.group_code)}</span>`];
  if(meta&&meta.grp_index&&meta.grp_index.includes('/')) tags.push(`<span class="tag">${esc(meta.grp_index.split('/')[1].trim())}</span>`);
  if(['T','XT','Z','ZP'].includes(co.group_code)) tags.push('<span class="tag r">Surveillance</span>');
  const path = meta ? [meta.industry_new,meta.igroup,meta.isubgroup].filter(Boolean).join(' &nbsp;›&nbsp; ') : '';
  const l = shp&&shp[0], q = (res||[]).filter(r=>r.period_type==='quarter').sort((a,b)=>qOrder(b.period)-qOrder(a.period))[0];
  const sr = (a,b)=>`<div class="snaprow"><span>${a}</span><span>${b}</span></div>`;
  const uu = {};
  if(ups && Array.isArray(ups.ratios)) ups.ratios.forEach(x=>{ uu[String(x.name).toUpperCase()] = x; });
  const un2 = v => { const f = parseFloat(String(v).replace('%','')); return isNaN(f)?null:f; };
  const pe = (meta && (meta.con_pe ?? meta.pe)) ?? (uu['P/E'] ? un2(uu['P/E'].company_value) : null);
  const pb = (meta && (meta.con_pb ?? meta.pb)) ?? (uu['P/B'] ? un2(uu['P/B'].company_value) : null);
  const snap = `<div class="snap">
    ${sr('Market cap', co.market_cap?cr(co.market_cap):'—')}
    ${pe!=null?sr('P / E', raw(pe)):''}
    ${pb!=null?sr('P / B', raw(pb)):''}
    ${rat&&rat.roce!=null?sr('ROCE',pct(rat.roce)):''}
    ${rat&&rat.roe!=null?sr('ROE',pct(rat.roe)):''}
    ${rat&&rat.debt_equity!=null?sr('Debt / equity',raw(rat.debt_equity)):''}
    ${l&&l.promoter_pct!=null?sr('Promoter',pct(l.promoter_pct)):''}
    ${l?sr('Encumbered', l.promoter_encumbered_pct?pct(l.promoter_encumbered_pct):'Nil'):''}
  </div>`;
  return `
  <div class="chead"><div>
  <div class="ptag">Company</div>
  <h1>${esc(co.company_name)}</h1>
  <div class="ids">${esc(co.nse_symbol||'')} &nbsp;·&nbsp; BSE ${esc(co.scrip_code)} &nbsp;·&nbsp; ${esc(co.isin||'')}${
    co.market_cap? ' &nbsp;·&nbsp; '+cr(co.market_cap)+' mcap':''}</div>
  <div id="ltp" class="ltpline"></div>
  <div class="tags">${tags.join('')}</div>
  ${ups&&ups.company_profile ? descBlock(ups.company_profile):''}
  ${path ? `<div class="sub">${path}</div>`:''}
  </div>${snap}</div>`;
}

function own(shp){
  if(!shp||!shp.length) return '';
  const l = shp[0], p = shp[1];
  const box=(lab,val,note)=>`<div class="m"><div class="mlab">${lab}</div>
     <div class="mval">${val}</div><div class="mdel fl">${note||''}</div></div>`;
  const d=(a,b)=>{ if(a==null||b==null) return ''; const x=a-b;
    return (x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(2)+' QoQ'; };
  const enc = l.promoter_encumbered_pct;

  // chart
  let chart='', legend='';
  const ser = shp.slice().reverse().filter(r=>r.promoter_pct!=null);
  if(ser.length>=4){
    const W=440,Hh=88, xs=i=>i*(W/(ser.length-1));
    const keys = ['promoter_pct','fii_pct','dii_pct'].filter(k=>{
      const v = ser.map(r=>r[k]).filter(x=>x!=null);
      if(v.length < 3) return false;
      return Math.max(...v) >= 1.5;           // ignore negligible holders
    });
    const all=[]; ser.forEach(r=>keys.forEach(k=>{ if(r[k]!=null) all.push(r[k]); }));
    const mx=Math.max(...all), mn=Math.min(...all), rg=(mx-mn)||1;
    const ys=v=>Hh-6-((v-mn)/rg)*(Hh-14);
    const line=(k,c,w)=>{
      const pts=ser.map((r,i)=> r[k]==null?null:`${xs(i).toFixed(1)},${ys(r[k]).toFixed(1)}`).filter(Boolean).join(' ');
      return pts?`<polyline fill="none" stroke="${c}" stroke-width="${w}" points="${pts}"/>`:'';
    };
    const COL={promoter_pct:'var(--ink)',fii_pct:'var(--gold)',dii_pct:'var(--grn)'};
    const LBL={promoter_pct:'Promoter',fii_pct:'FII',dii_pct:'DII'};
    chart = `<div class="chart">
      <svg viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}" preserveAspectRatio="none">
        ${keys.map(k=>line(k,COL[k],k==='promoter_pct'?2:1.5)).join('')}
      </svg></div>
      <div class="clab"><span>${esc(ser[0].quarter)}</span><span>${esc(ser[ser.length-1].quarter)}</span></div>`;
    legend = keys.map(k=>`<span><i style="background:${COL[k]}"></i>${LBL[k]}</span>`).join('');
    if(!keys.length) chart='';
  }

  const notes=[];
  if(ser.length>=4){
    const f=ser[0], t=ser[ser.length-1];
    if(f.promoter_pct!=null&&t.promoter_pct!=null){
      const ch=t.promoter_pct-f.promoter_pct;
      notes.push(Math.abs(ch)<0.5
        ? `<div class="flag"><div class="flagt">Promoter stake steady</div><div class="flagb">${pct(t.promoter_pct)} today against ${pct(f.promoter_pct)} ${ser.length} quarters ago — no meaningful change.</div></div>`
        : `<div class="flag ${ch<0?'r':'g'}"><div class="flagt">Promoter stake ${ch<0?'declining':'rising'}</div><div class="flagb">${ch>0?'Up':'Down'} ${Math.abs(ch).toFixed(2)} points over ${ser.length} quarters, from ${pct(f.promoter_pct)} to ${pct(t.promoter_pct)}.</div></div>`);
    }
    if(f.fii_pct!=null&&t.fii_pct!=null&&Math.abs(t.fii_pct-f.fii_pct)>=1){
      const ch=t.fii_pct-f.fii_pct;
      notes.push(`<div class="flag ${ch<0?'r':'g'}"><div class="flagt">Foreign holding ${ch<0?'reducing':'building'}</div><div class="flagb">FII stake moved from ${pct(f.fii_pct)} to ${pct(t.fii_pct)} across the period.</div></div>`);
    }
  }
  if(enc!=null&&enc>0) notes.push(`<div class="flag r"><div class="flagt">Promoter shares encumbered</div><div class="flagb">${pct(enc)} of the promoter holding is pledged or otherwise encumbered — lender claims sit against it.</div></div>`);
  else if(enc!=null) notes.push(`<div class="flag g"><div class="flagt">No encumbrance</div><div class="flagb">No promoter shares pledged or under any other encumbrance.</div></div>`);

  return `<section>
   <div class="sech"><span>Ownership</span><i>${esc(l.quarter)} · ${shp.length} quarters on record</i></div>
   <div class="mrow">
     ${box('Promoter',pct(l.promoter_pct),d(l.promoter_pct,p&&p.promoter_pct))}
     ${box('Encumbered',enc==null?'—':(enc>0?pct(enc):'Nil'),enc>0?'of promoter stake':'no pledge')}
     ${box('FII',pct(l.fii_pct),d(l.fii_pct,p&&p.fii_pct))}
     ${box('DII',pct(l.dii_pct),d(l.dii_pct,p&&p.dii_pct))}
     ${box('Shareholders',l.public_holders?Number(l.public_holders).toLocaleString('en-IN'):'—','public')}
   </div>
   ${chart||notes.length?`<div style="margin-top:18px"><div>
      ${chart?`<div class="ckey">${legend}</div>${chart}`:''}
     </div><div>${notes.join('')}</div></div>`:''}
  </section>`;
}

function latest(res,rat){
  const q = res.filter(r=>r.period_type==='quarter').sort((a,b)=>qOrder(b.period)-qOrder(a.period));
  if(!q.length && !rat) return '';
  const c=q[0], p=q[1];
  if(!c) return '';
  return `<section>
    <div class="sech"><span>Latest quarter</span><i>${esc(c.period)}</i></div>
    <div class="mrow">
      <div class="m"><div class="mlab">Revenue</div><div class="mval">${cr(c.revenue)}</div>${delta(c.revenue,p&&p.revenue,'QoQ')}</div>
      <div class="m"><div class="mlab">Net profit</div><div class="mval">${cr(c.net_profit)}</div>${delta(c.net_profit,p&&p.net_profit,'QoQ')}</div>
      <div class="m"><div class="mlab">Operating margin</div><div class="mval">${pct(c.opm)}</div><div class="mdel fl">${p&&p.opm!=null?'was '+pct(p.opm):''}</div></div>
      <div class="m"><div class="mlab">EPS</div><div class="mval">${c.eps!=null?'₹'+raw(c.eps):'—'}</div><div class="mdel fl">${c.cash_eps!=null?'cash ₹'+raw(c.cash_eps):''}</div></div>
    </div></section>`;
}

function ratios(rat,stat,peers,code,meta,ups){
  if(!rat) return '';
  const rows=[
    ['ROCE','roce','med_roce','pct',1],['ROE','roe','med_roe','pct',1],
    ['ROA','roa',null,'pct',1],['Operating margin','opm','med_opm','pct',1],
    ['Net margin','npm','med_npm','pct',1],['Debt / equity','debt_equity','med_debt_equity','num',0],
    ['Current ratio','current_ratio','med_current_ratio','num',1],
    ['CFO / PAT','cfo_pat','med_cfo_pat','num',1],
    ['Debtor days','debtor_days','med_debtor_days','day',1],
    ['Cash cycle','cash_cycle','med_cash_cycle','day',1]
  ];
  const fmt=(v,k)=> v==null?'—': k==='pct'?pct(v):k==='day'?raw(v,1)+' d':raw(v,2);
  const lower=new Set(['debt_equity','debtor_days','cash_cycle']);

  // valuation from BSE meta + Upstox key-ratios (which carries a sector value)
  const U = {};
  if(ups && Array.isArray(ups.ratios))
    ups.ratios.forEach(x=>{ U[String(x.name).toUpperCase()] = x; });
  const un = v => { const f = parseFloat(String(v).replace('%','')); return isNaN(f)?null:f; };
  const val = [];
  const push = (label, own, u) => {
    const c = own!=null ? own : (u ? un(u.company_value) : null);
    const m = u ? un(u.sector_value) : null;
    if(c!=null) val.push([label, c, m]);
  };
  push('P/E',  meta ? (meta.con_pe ?? meta.pe) : null, U['P/E']);
  push('P/B',  meta ? (meta.con_pb ?? meta.pb) : null, U['P/B']);
  push('EV / EBITDA', null, U['EV/EBITDA']);
  const valRows = val.map(([lab,c,m])=>{
    let read='';
    if(m!=null && m){
      const gap = (c-m)/Math.abs(m);
      read = Math.abs(gap)<0.08 ? '<span style="color:var(--mut2)">In line</span>'
           : gap>0 ? '<span style="color:var(--amb)">Premium</span>'
                   : '<span style="color:var(--grn)">Discount</span>';
    }
    return `<tr><td>${lab}</td><td>${raw(c)}</td><td class="dim">${m==null?'—':raw(m)}</td><td class="v">${read}</td></tr>`;
  }).join('');

  const body = rows.map(([lab,f,mf,k])=>{
    const v=rat[f], m=mf&&stat?stat[mf]:null;
    let read='';
    if(v!=null&&m!=null){
      const better = lower.has(f) ? v<m : v>m;
      const gap = Math.abs(v-m)/(Math.abs(m)||1);
      read = gap<0.08 ? `<span style="color:var(--mut2)">In line</span>`
           : better ? `<span style="color:var(--grn)">Better</span>`
                    : `<span style="color:var(--red)">Worse</span>`;
    }
    return `<tr><td>${lab}</td><td>${fmt(v,k)}</td><td class="dim">${fmt(m,k)}</td><td class="v">${read}</td></tr>`;
  }).join('');

  // ranks
  let ranks='';
  if(peers&&peers.length>=4){
    const defs=[['ROCE','roce',false],['ROE','roe',false],['Debt / equity','debt_equity',true],
                ['CFO / PAT','cfo_pat',false],['Current ratio','current_ratio',false]];
    ranks = defs.map(([lab,f,asc])=>{
      const vals=peers.filter(p=>p[f]!=null).map(p=>({c:p.scrip_code,v:+p[f]}));
      if(vals.length<4) return '';
      vals.sort((a,b)=> asc ? a.v-b.v : b.v-a.v);
      const i=vals.findIndex(x=>x.c===code);
      if(i<0) return '';
      const posPct = vals.length>1 ? (1-(i/(vals.length-1)))*100 : 50;
      return `<div class="rk"><div class="rkn">${lab}</div>
        <div class="rkbar"><u style="left:${posPct.toFixed(0)}%"></u></div>
        <div class="rkv"><b>${i+1}</b> of ${vals.length}</div></div>`;
    }).join('');
  }

  const flags=[];
  if(rat.cfo_pat!=null){
    flags.push(rat.cfo_pat>=1
      ? `<div class="flag g"><div class="flagt">Earnings backed by cash</div><div class="flagb">Operating cash flow is ${raw(rat.cfo_pat)}× reported profit.</div></div>`
      : rat.cfo_pat>0
      ? `<div class="flag r"><div class="flagt">Cash lags profit</div><div class="flagb">Operating cash flow is only ${raw(rat.cfo_pat)}× reported profit — worth checking receivables.</div></div>`
      : `<div class="flag r"><div class="flagt">Negative operating cash flow</div><div class="flagb">The business consumed cash despite its reported profit.</div></div>`);
  }
  if(rat.debt_equity!=null&&rat.debt_equity>1.5)
    flags.push(`<div class="flag r"><div class="flagt">Leverage elevated</div><div class="flagb">Debt is ${raw(rat.debt_equity)}× equity.</div></div>`);

  return `<section>
    <div class="sech"><span>Ratios</span><i>${stat?`vs ${esc(rat.peer_group)} · ${stat.companies} peers`:'peer group unavailable'}${rat.period?' · FY ending '+dmy(rat.period):''}</i></div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:28px" class="ratiogrid">
      <div class="scroll"><table>
        <tr><th>Metric</th><th>Company</th><th>Peer median</th><th style="width:74px">Read</th></tr>
        ${valRows}
        ${valRows?'<tr class="gaprow"><td colspan="4"></td></tr>':''}
        ${body}
      </table></div>
      <div>
        ${ranks?`<div class="rkn" style="color:var(--mut2);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px">Rank among peers</div>${ranks}`:''}
        <div style="margin-top:${ranks?'16px':'0'}">${flags.join('')}</div>
      </div>
    </div></section>`;
}

function quarterly(res, qfin){
  // pivot quarterly income statement
  const map = {};
  (qfin||[]).forEach(r=>{ (map[r.period] = map[r.period] || {})[r.field] = r.value; });
  let periods = Object.keys(map).sort().slice(-5);

  // BSE snapshot gives EPS / Cash EPS keyed by labels like "Jun-26"
  const snap = {};
  (res||[]).filter(r=>r.period_type==='quarter').forEach(r=>{ snap[qOrder(r.period)] = r; });
  const key = p => { const d=new Date(p); return d.getFullYear()*100 + (d.getMonth()+1); };

  if(!periods.length){
    // fall back to the snapshot alone
    const q = (res||[]).filter(r=>r.period_type==='quarter').sort((x,y)=>qOrder(x.period)-qOrder(y.period));
    const y = (res||[]).filter(r=>r.period_type==='annual');
    if(!q.length) return '';
    const cols = q.concat(y);
    const row=(lab,f,fn)=>`<tr><td>${lab}</td>`+cols.map((c,i)=>
      `<td class="${i>=q.length?'sep':''}">${c[f]==null?'—':fn(c[f])}</td>`).join('')+'</tr>';
    return `<section><div class="sech"><span>Results</span><i>&#8377; crore</i></div>
      <div class="scroll"><table>
        <tr><th>&nbsp;</th>${cols.map((c,i)=>`<th class="${i>=q.length?'sep':''}">${esc(c.period)}</th>`).join('')}</tr>
        ${row('Revenue','revenue',v=>Math.round(v).toLocaleString('en-IN'))}
        ${row('Net profit','net_profit',v=>Math.round(v).toLocaleString('en-IN'))}
        ${row('OPM %','opm',v=>(v>200||v<-200)?'—':raw(v))}
        ${row('NPM %','npm',v=>(v>200||v<-200)?'—':raw(v))}
        ${row('EPS &#8377;','eps',v=>raw(v))}
      </table></div></section>`;
  }

  const cr1 = v => v==null ? '—' : Math.round(v/10000000).toLocaleString('en-IN');
  const lab = p => {
    const d = new Date(p);
    return ['Mar','Jun','Sep','Dec'][Math.floor(d.getMonth()/3)] + " '" + String(d.getFullYear()).slice(2);
  };
  const get = (p,f) => map[p] ? map[p][f] : null;
  const pctOf = (p,num,den) => {
    const a = get(p,num), b = get(p,den);
    if(a==null || !b || b<=0) return null;
    const v = a/b*100;
    return (v > 200 || v < -200) ? null : v;   // ratio is meaningless at that scale
  };
  const snapFor = p => snap[key(p)] || null;

  const row = (label, fn, series) =>
    `<tr><td>${label}</td>${periods.map(p=>`<td>${fn(p)}</td>`).join('')}` +
    `<td class="sep" style="text-align:right">${series?spark(series):''}</td></tr>`;
  const ser = f => periods.map(p=>get(p,f));
  const serPct = (a,b) => periods.map(p=>pctOf(p,a,b));

  return `<section>
    <div class="sech"><span>Quarterly results</span><i>&#8377; crore &middot; consolidated where reported</i></div>
    <div class="scroll"><table>
      <tr><th>&nbsp;</th>${periods.map(p=>`<th>${lab(p)}</th>`).join('')}<th class="sep" style="width:76px">Trend</th></tr>
      ${row('Revenue', p=>cr1(get(p,'Total Revenue')), ser('Total Revenue'))}
      ${row('Operating profit', p=>cr1(get(p,'EBIT')), ser('EBIT'))}
      ${row('Net profit', p=>cr1(get(p,'Net Income')), ser('Net Income'))}
      ${row('OPM %', p=>{const v=pctOf(p,'EBIT','Total Revenue'); return v==null?'—':raw(v);}, serPct('EBIT','Total Revenue'))}
      ${row('NPM %', p=>{const v=pctOf(p,'Net Income','Total Revenue'); return v==null?'—':raw(v);}, serPct('Net Income','Total Revenue'))}
      ${row('EPS &#8377;', p=>{
          const s0 = snapFor(p);
          if(s0 && s0.eps!=null) return raw(s0.eps);
          const v = get(p,'Diluted EPS') ?? get(p,'Basic EPS');
          return v==null?'—':raw(v);
       }, periods.map(p=>{const s0=snapFor(p); return s0&&s0.eps!=null?s0.eps:(get(p,'Diluted EPS') ?? get(p,'Basic EPS'));}))}
      ${row('Interest', p=>cr1(get(p,'Interest Expense')), ser('Interest Expense'))}
      ${row('Tax', p=>cr1(get(p,'Tax Provision')), ser('Tax Provision'))}
    </table></div></section>`;
}

function annual(fin){
  if(!fin||!fin.length) return '';
  const map={};
  fin.forEach(r=>{ (map[r.period] = map[r.period]||{})[r.field] = r.value; });
  const periods = Object.keys(map).sort().slice(-5);
  if(periods.length<2) return '';
  const F=[['Revenue','Total Revenue'],['Operating profit','EBIT'],['Net profit','Net Income'],
           ['Total assets','Total Assets'],['Total debt','Total Debt'],['Equity','Stockholders Equity'],
           ['Operating cash flow','Operating Cash Flow'],['Free cash flow','Free Cash Flow'],
           ['Shares outstanding','Ordinary Shares Number']];
  const body = F.map(([lab,f])=>{
    if(!periods.some(p=>map[p][f]!=null)) return '';
    return `<tr><td>${lab}</td>`+periods.map(p=>{
      const v=map[p][f];
      if(v==null) return '<td>—</td>';
      if(f==='Ordinary Shares Number') return `<td>${(v/10000000).toFixed(1)} Cr</td>`;
      return `<td>${Math.round(v/10000000).toLocaleString('en-IN')}</td>`;
    }).join('')+'</tr>';
  }).join('');

  // dilution note
  let note='';
  const sh=periods.map(p=>map[p]['Ordinary Shares Number']).filter(v=>v!=null);
  if(sh.length>=2){
    const ch=(sh[sh.length-1]-sh[0])/sh[0]*100;
    if(ch>3) note=`<div class="flag ${ch>60?'':'r'}" style="margin-top:14px"><div class="flagt">Share count rose ${ch.toFixed(0)}%</div><div class="flagb">${ch>60?'A large jump usually means a bonus issue or split rather than dilution — per-share figures across the period are not directly comparable.':'Outstanding shares increased over the period, so per-share growth understates absolute growth.'}</div></div>`;
  }
  return `<section>
    <div class="sech"><span>Annual</span><i>₹ crore · as filed</i></div>
    <div class="scroll"><table>
      <tr><th>&nbsp;</th>${periods.map(p=>`<th>${p.slice(0,4)}</th>`).join('')}</tr>
      ${body}
    </table></div>${note}</section>`;
}

function newsOnly(news){

     <div class="nwm"><b>${esc(x.publisher||'')}</b> · ${dmy(x.published)}</div></div>`).join('')
    : '<div class="nwm">Quiet in the press lately.</div>';
  return `<section><div class="sech"><span>In the news</span><i>links to publisher</i></div>${n}</section>`;
}

function newsBlock(news,co,docs){

     <div class="nwm"><b>${esc(x.publisher||'')}</b> · ${dmy(x.published)}</div></div>`).join('')

     <div class="thm">${dmy(x.filed_at)}${x.pages?' · '+x.pages+' pages':''}</div></div>`).join('')
    : '<div class="thm">No earnings call filed with the exchange. Not every company holds one.</div>';

  return `<section>
    <div class="sech"><span>Coverage</span><i>headlines link to the publisher · documents as filed with BSE</i></div>

        ${d}
      </div>
    </div></section>`;
}

/* ---------- theme ---------- */
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function curTheme(){
  return document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
}
function paintTheme(){
  const i = document.getElementById('ticon');
  if(i) i.innerHTML = curTheme()==='dark' ? SUN : MOON;
}
(function initTheme(){
  let t = null;
  try{ t = localStorage.getItem('rd-theme'); }catch(e){}
  if(t) document.documentElement.setAttribute('data-theme', t);
})();
document.addEventListener('DOMContentLoaded', ()=>{
  paintTheme();
  const mb = document.getElementById('mbtn'), dr = document.getElementById('drawer');
  if(mb && dr){
    mb.onclick = ()=> dr.classList.add('open');
    dr.onclick = e => { if(e.target === dr) dr.classList.remove('open'); };
    const dt = document.getElementById('dtheme');
    if(dt) dt.onclick = e => {
      e.preventDefault();
      const next = curTheme()==='dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('rd-theme', next); }catch(err){}
      paintTheme();
      dt.textContent = next==='dark' ? 'Switch to light' : 'Switch to dark';
    };
    if(dt) dt.textContent = curTheme()==='dark' ? 'Switch to light' : 'Switch to dark';
  }
  const b = document.getElementById('tbtn');
  if(b) b.onclick = ()=>{
    const next = curTheme()==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('rd-theme', next); }catch(e){}
    paintTheme();
  };
});

/* ---------- shared helpers ---------- */
const QSEQ = {Mar:1,Jun:2,Sep:3,Dec:4};
const qKey = q => { const t=String(q).match(/([A-Za-z]{3})\s*(\d{4})/); return t ? (+t[2])*10+(QSEQ[t[1]]||0) : 0; };
let RATIOS=null, STATS=null, METAMAP=null;

async function loadRatios(){
  if(RATIOS) return RATIOS;
  let rows=[], off=0;
  while(true){
    const p = await api(`ratios?select=scrip_code,roce,roe,opm,npm,debt_equity,current_ratio,cfo_pat,debtor_days,cash_cycle,revenue,net_profit,peer_group,industry_new,igroup&limit=1000&offset=${off}&order=scrip_code.asc`);
    if(!p.length) break; rows=rows.concat(p);
    if(p.length<1000) break; off+=1000;
  }
  RATIOS = rows; return RATIOS;
}
async function loadStats(){
  if(STATS) return STATS;
  const rows = await api('sector_stats?select=*&limit=1000');
  STATS = {}; rows.forEach(r=>{ STATS[r.peer_group]=r; }); return STATS;
}

/* ---------- sectors ---------- */
let SECIND = null;
async function sectorsPage(sel){
  document.title = 'Sectors — ResearchDesk';
  document.querySelectorAll('.navlinks a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='/sectors'));
  $('#main').innerHTML = `
    <div class="pagehead"><div class="ptag">Sectors</div>
      <h2>Where the money is being made</h2>
      <p>Returns, leverage and valuation across 22 industries — and what management
         has been talking about on earnings calls.</p></div>
    <div id="sectorbody"><div class="msg">Loading…</div></div>`;

  const [rats, list] = await Promise.all([loadRatios(), loadList()]);
  const byCode = {}; list.forEach(c=>{ byCode[c.scrip_code]=c; });

  if(!SECIND){
    const m = {};
    rats.forEach(r=>{ if(r.industry_new) (m[r.industry_new] = m[r.industry_new]||[]).push(r); });
    SECIND = Object.entries(m).filter(([,v])=>v.length>=5).sort((a,b)=>b[1].length-a[1].length);
  }
  const med = (arr,f)=>{ const v=arr.map(x=>x[f]).filter(x=>x!=null).sort((a,b)=>a-b);
    return v.length? (v.length%2 ? v[(v.length-1)/2] : (v[v.length/2-1]+v[v.length/2])/2) : null; };

  const tabs = `<div class="stab">
    <button class="${!sel?'on':''}" data-s="">All industries</button>
    ${SECIND.map(([n])=>`<button class="${sel===n?'on':''}" data-s="${esc(n)}">${esc(n)}</button>`).join('')}
  </div>`;

  let body;
  if(!sel){
    const rows = SECIND.map(([name,co])=>{
      const mcap = co.reduce((s,r)=>s+((byCode[r.scrip_code]||{}).market_cap||0),0);
      return {name, n:co.length, mcap, roce:med(co,'roce'), roe:med(co,'roe'),
              opm:med(co,'opm'), de:med(co,'debt_equity'), cfo:med(co,'cfo_pat')};
    }).sort((a,b)=>(b.roce??-999)-(a.roce??-999));
    body = `<div class="tbl"><table>
      <tr><th>Industry</th><th>Companies</th><th>Combined mcap</th><th>ROCE</th><th>ROE</th>
          <th>OPM</th><th>Debt / eq</th><th>CFO / PAT</th></tr>
      ${rows.map(r=>`<tr><td><a href="${sectorHref(r.name)}">${esc(r.name)}</a></td>
        <td>${r.n}</td><td>${r.mcap?cr(r.mcap):'—'}</td>
        <td>${r.roce==null?'—':pct(r.roce)}</td><td>${r.roe==null?'—':pct(r.roe)}</td>
        <td>${r.opm==null?'—':pct(r.opm)}</td><td>${r.de==null?'—':raw(r.de)}</td>
        <td>${r.cfo==null?'—':raw(r.cfo)}</td></tr>`).join('')}
    </table></div>
    <p class="resbar" style="margin-top:12px">Medians across companies with computed ratios. Sorted by ROCE.</p>`;
  } else {
    const co = (SECIND.find(([n])=>n===sel)||[null,[]])[1];
    const sorted = co.slice().sort((a,b)=>(b.roce??-999)-(a.roce??-999));
    body = `<div class="grid" style="margin-bottom:16px">
      <div class="card h-teal"><section><div class="sech"><span>Sector medians</span><i>${co.length} companies</i></div>
        <div class="mrow">
          <div class="m"><div class="mlab">ROCE</div><div class="mval">${med(co,'roce')==null?'—':pct(med(co,'roce'))}</div></div>
          <div class="m"><div class="mlab">ROE</div><div class="mval">${med(co,'roe')==null?'—':pct(med(co,'roe'))}</div></div>
          <div class="m"><div class="mlab">Op margin</div><div class="mval">${med(co,'opm')==null?'—':pct(med(co,'opm'))}</div></div>
          <div class="m"><div class="mlab">Debt / equity</div><div class="mval">${med(co,'debt_equity')==null?'—':raw(med(co,'debt_equity'))}</div></div>
        </div></section></div>
      <div class="card h-purple" id="themecard"><section>
        <div class="sech"><span>What management is saying</span><i>loading…</i></div>
        <div class="thm" style="padding:4px 0">Reading transcripts…</div></section></div>
    </div>
    <div class="tbl"><table>
      <tr><th>Company</th><th>ROCE</th><th>ROE</th><th>OPM</th><th>Debt / eq</th><th>CFO / PAT</th><th>Revenue</th></tr>
      ${sorted.slice(0,60).map(r=>{const c=byCode[r.scrip_code]||{};
        return `<tr><td><a href="${slug(c.company_name,r.scrip_code)}">${esc((c.company_name||r.scrip_code).replace(/ Ltd\.?$/,''))}</a></td>
        <td>${r.roce==null?'—':pct(r.roce)}</td><td>${r.roe==null?'—':pct(r.roe)}</td>
        <td>${r.opm==null?'—':pct(r.opm)}</td><td>${r.debt_equity==null?'—':raw(r.debt_equity)}</td>
        <td>${r.cfo_pat==null?'—':raw(r.cfo_pat)}</td><td>${r.revenue?cr(r.revenue/10000000):'—'}</td></tr>`;}).join('')}
    </table></div>`;
  }
  document.getElementById('sectorbody').innerHTML = tabs + body;
  document.querySelectorAll('.stab button').forEach(b=> b.onclick = ()=>{
    const v = b.dataset.s;
    history.pushState({}, '', v ? sectorHref(v) : '/sectors');
    sectorsPage(v||null);
  });
  if(sel) sectorThemes(sel, (SECIND.find(([n])=>n===sel)||[null,[]])[1]);
}

async function sectorThemes(name, co){
  const codes = co.map(r=>r.scrip_code);
  const el = document.getElementById('themecard');
  if(!el || !codes.length) return;
  let rows = [];
  for(let i=0;i<codes.length;i+=120){
    const chunk = codes.slice(i,i+120).map(c=>`scrip_code.eq.${c}`).join(',');
    rows = rows.concat(await api(`themes?select=scrip_code,quarter,theme&or=(${chunk})&limit=4000`));
  }
  if(!rows.length){ el.innerHTML = `<section><div class="sech"><span>What management is saying</span><i>no transcripts</i></div>
    <div class="thm" style="padding:4px 0">No earnings calls indexed for this industry yet.</div></section>`; return; }

  const qs = [...new Set(rows.map(r=>r.quarter))].sort((a,b)=>qKey(b)-qKey(a));
  const cur = qs[0], prev = qs[1];
  const count = (q,t) => new Set(rows.filter(r=>r.quarter===q && r.theme===t).map(r=>r.scrip_code)).size;
  const base = new Set(rows.filter(r=>r.quarter===cur).map(r=>r.scrip_code)).size || 1;
  const themes = [...new Set(rows.map(r=>r.theme))]
    .map(t=>({t, c:count(cur,t), p:prev?count(prev,t):null}))
    .filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,8);

  el.innerHTML = `<section>
    <div class="sech"><span>What management is saying</span><i>${esc(cur)} · ${base} calls</i></div>
    ${themes.map(x=>{
      const w = Math.round(x.c/base*100);
      const rising = x.p!=null && x.c>x.p, falling = x.p!=null && x.c<x.p;
      const col = rising ? 'var(--amb)' : 'var(--mut2)';
      return `<div class="themerow"><div class="themen">${esc(x.t)}</div>
        <div class="themeb"><span style="width:${w}%;background:${col}"></span></div>
        <div class="themev"><em>${x.c}</em> of ${base}${x.p!=null?` <span class="${rising?'deltaup':(falling?'deltadn':'')}">${x.c>x.p?'▲':(x.c<x.p?'▼':'·')}${Math.abs(x.c-x.p)||''}</span>`:''}</div></div>`;
    }).join('')}
    <div class="thm" style="padding:11px 0 0">Companies raising each theme on their latest call${prev?`, against ${esc(prev)}`:''}.</div>
  </section>`;
}

/* ---------- screens ---------- */
const SAVED = {
  quality:  {label:'Quality without leverage', roce:15, de:1, cfo:0.8, pledge:'nil'},
  pledged:  {label:'Promoter pledge above 25%', pledge:'25'},
  cashgap:  {label:'Profit up, cash behind',    cfo:'lt0.6'},
  hidden:   {label:'High ROCE, small cap',      roce:20, mcapmax:5000}
};
async function screensPage(preset){
  document.title = 'Screens — ResearchDesk';
  document.querySelectorAll('.navlinks a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='/screens'));
  $('#main').innerHTML = `
    <div class="pagehead"><div class="ptag">Screens</div>
      <h2>Filter the whole market</h2>
      <p>Every listed company with computed ratios, filtered on returns, leverage,
         cash quality and ownership.</p></div>
    <div class="saved" id="saved">${Object.entries(SAVED).map(([k,v])=>
      `<button data-k="${k}">${esc(v.label)}</button>`).join('')}</div>
    <div class="filters" id="filters">
      <div class="f"><label>Industry</label><select id="f-ind"><option value="">All</option></select></div>
      <div class="f"><label>ROCE above</label><input id="f-roce" type="number" placeholder="%" step="1"></div>
      <div class="f"><label>Debt / equity below</label><input id="f-de" type="number" placeholder="x" step="0.1"></div>
      <div class="f"><label>CFO / PAT above</label><input id="f-cfo" type="number" placeholder="x" step="0.1"></div>
      <div class="f"><label>Encumbrance</label><select id="f-pl">
        <option value="">Any</option><option value="nil">None</option>
        <option value="any">Any pledge</option><option value="25">Above 25%</option></select></div>
      <div class="f"><label>Market cap min</label><input id="f-mc" type="number" placeholder="₹ Cr" step="100"></div>
      <div class="f"><label>Market cap max</label><input id="f-mx" type="number" placeholder="₹ Cr" step="100"></div>
      <div class="f"><label>Sort by</label><select id="f-sort">
        <option value="roce">ROCE</option><option value="roe">ROE</option>
        <option value="cfo_pat">CFO / PAT</option><option value="opm">Operating margin</option>
        <option value="mcap">Market cap</option></select></div>
    </div>
    <div class="resbar" id="resbar">Loading…</div>
    <div id="screenout"></div>`;

  const [rats, list] = await Promise.all([loadRatios(), loadList()]);
  const byCode = {}; list.forEach(c=>{ byCode[c.scrip_code]=c; });

  const shpRows = await (async()=>{
    let out=[], off=0;
    while(true){
      const p = await api(`shareholding?select=scrip_code,qtrid,promoter_pct,promoter_encumbered_pct&filing_type=eq.quarterly&limit=1000&offset=${off}&order=scrip_code.asc,qtrid.desc`);
      if(!p.length) break; out=out.concat(p);
      if(p.length<1000) break; off+=1000;
      if(off>20000) break;
    }
    const latest={}; out.forEach(r=>{ if(!latest[r.scrip_code]) latest[r.scrip_code]=r; });
    return latest;
  })();

  const inds = [...new Set(rats.map(r=>r.industry_new).filter(Boolean))].sort();
  document.getElementById('f-ind').innerHTML =
    '<option value="">All</option>' + inds.map(i=>`<option>${esc(i)}</option>`).join('');

  function run(){
    const g = id => document.getElementById(id).value.trim();
    const ind=g('f-ind'), roce=parseFloat(g('f-roce')), de=parseFloat(g('f-de')),
          cfo=parseFloat(g('f-cfo')), pl=g('f-pl'),
          mc=parseFloat(g('f-mc')), mx=parseFloat(g('f-mx')), sort=g('f-sort');
    let out = rats.filter(r=>{
      const c = byCode[r.scrip_code]; if(!c) return false;
      if(ind && r.industry_new!==ind) return false;
      if(!isNaN(roce) && (r.roce==null || r.roce<roce)) return false;
      if(!isNaN(de)   && (r.debt_equity==null || r.debt_equity>de)) return false;
      if(!isNaN(cfo)  && (r.cfo_pat==null || r.cfo_pat<cfo)) return false;
      if(!isNaN(mc)   && (!c.market_cap || c.market_cap<mc)) return false;
      if(!isNaN(mx)   && (!c.market_cap || c.market_cap>mx)) return false;
      if(pl){
        const sh = shpRows[r.scrip_code];
        const e = sh ? (sh.promoter_encumbered_pct||0) : null;
        if(pl==='nil' && !(e===0 || e==null && sh)) return false;
        if(pl==='any' && !(e>0)) return false;
        if(pl==='25'  && !(e>25)) return false;
      }
      return true;
    });
    out.sort((a,b)=>{
      if(sort==='mcap') return ((byCode[b.scrip_code]||{}).market_cap||0)-((byCode[a.scrip_code]||{}).market_cap||0);
      return (b[sort]??-9999)-(a[sort]??-9999);
    });
    document.getElementById('resbar').innerHTML =
      `<span><b>${out.length}</b> companies match</span><span>Showing the first ${Math.min(out.length,80)}</span>`;
    document.getElementById('screenout').innerHTML = out.length ? `<div class="tbl"><table>
      <tr><th>Company</th><th>Mcap</th><th>ROCE</th><th>ROE</th><th>OPM</th>
          <th>Debt / eq</th><th>CFO / PAT</th><th>Promoter</th><th style="width:74px">Pledge</th></tr>
      ${out.slice(0,80).map(r=>{
        const c=byCode[r.scrip_code]||{}, sh=shpRows[r.scrip_code];
        const e = sh ? sh.promoter_encumbered_pct : null;
        return `<tr><td><a href="${slug(c.company_name,r.scrip_code)}">${esc((c.company_name||'').replace(/ Ltd\.?$/,''))}</a></td>
          <td>${c.market_cap?cr(c.market_cap):'—'}</td>
          <td>${r.roce==null?'—':pct(r.roce)}</td><td>${r.roe==null?'—':pct(r.roe)}</td>
          <td>${r.opm==null?'—':pct(r.opm)}</td><td>${r.debt_equity==null?'—':raw(r.debt_equity)}</td>
          <td>${r.cfo_pat==null?'—':raw(r.cfo_pat)}</td>
          <td>${sh&&sh.promoter_pct!=null?pct(sh.promoter_pct):'—'}</td>
          <td class="v">${e==null?'—':(e>0?`<span style="color:var(--red)">${raw(e,1)}%</span>`:'Nil')}</td></tr>`;
      }).join('')}</table></div>`
      : '<div class="msg">Nothing matches those filters. Try loosening one.</div>';
  }

  document.querySelectorAll('#filters input,#filters select').forEach(el=>{
    el.oninput = run; el.onchange = run;
  });
  document.querySelectorAll('#saved button').forEach(b=> b.onclick = ()=>{
    const p = SAVED[b.dataset.k];
    ['f-roce','f-de','f-cfo','f-mc','f-mx'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-pl').value=''; document.getElementById('f-ind').value='';
    if(p.roce) document.getElementById('f-roce').value=p.roce;
    if(p.de)   document.getElementById('f-de').value=p.de;
    if(p.cfo && typeof p.cfo==='number') document.getElementById('f-cfo').value=p.cfo;
    if(p.pledge) document.getElementById('f-pl').value = p.pledge==='nil'?'nil':(p.pledge==='25'?'25':'any');
    if(p.mcapmax) document.getElementById('f-mx').value=p.mcapmax;
    run();
  });
  if(preset && SAVED[preset]){ const b=document.querySelector(`#saved button[data-k="${preset}"]`); if(b) b.click(); }
  else run();
}

/* ---------- boot ---------- */
const _p = new URLSearchParams(location.search);
const _path = location.pathname.replace(/\/+$/,'');
const _m = _path.match(/^\/company\/(?:.*-)?(\d{6})$/);
const _sm = _path.match(/^\/sector\/(.+)$/);
const code = _m ? _m[1] : _p.get('code');
const pageArg = _sm ? 'sectors' : (_path === '/sectors' ? 'sectors'
              : _path === '/screens' ? 'screens' : _p.get('page'));
const _sector = _sm ? decodeURIComponent(_sm[1]).replace(/-/g,' ') : _p.get('s');
(code ? company(code)
      : pageArg === 'sectors' ? sectorsPage(_sector)
      : pageArg === 'screens' ? screensPage(_p.get('q'))
      : home()).catch(e=>{
  $('#main').innerHTML = '<div class="msg">Something went wrong loading this page.</div>';
  console.error(e);
});
loadList();
</script>
